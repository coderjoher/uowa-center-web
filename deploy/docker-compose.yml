# The whole site on one server: the website (with its admin at /admin), its
# Postgres database, and Caddy in front for HTTPS. Settings come from
# deploy/.env (create it with ./generate-env.sh). See deploy/README.md.
name: uowa-center

services:
  db:
    image: public.ecr.aws/docker/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cms
      POSTGRES_USER: cms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in deploy/.env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cms -d cms"]
      interval: 5s
      timeout: 5s
      retries: 20

  site:
    build: ..
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://cms:${POSTGRES_PASSWORD}@db:5432/cms
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:?set in deploy/.env}
    volumes:
      # Pictures and videos uploaded in the admin.
      - media:/data/media

  caddy:
    image: public.ecr.aws/docker/library/caddy:2-alpine
    restart: unless-stopped
    depends_on: [site]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?set in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data:
  media:
  caddy-data:
  caddy-config:
