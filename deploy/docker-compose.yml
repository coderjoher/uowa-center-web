# The whole site on one server: the website, the Strapi CMS, its Postgres
# database, and Caddy in front for HTTPS. Settings come from deploy/.env
# (create it with ./generate-env.sh). See deploy/README.md.
name: uowa-center

services:
  db:
    image: public.ecr.aws/docker/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: strapi
      POSTGRES_USER: strapi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in deploy/.env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U strapi -d strapi"]
      interval: 5s
      timeout: 5s
      retries: 20

  cms:
    build: ../cms
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: 1337
      PUBLIC_URL: https://${CMS_DOMAIN:?set in deploy/.env}
      IS_PROXIED: "true"
      DATABASE_CLIENT: postgres
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: strapi
      DATABASE_USERNAME: strapi
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      APP_KEYS: ${APP_KEYS:?set in deploy/.env}
      API_TOKEN_SALT: ${API_TOKEN_SALT:?set in deploy/.env}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:?set in deploy/.env}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT:?set in deploy/.env}
      JWT_SECRET: ${JWT_SECRET:?set in deploy/.env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set in deploy/.env}
      # Strapi calls the website directly on the internal network on every publish.
      SITE_REVALIDATE_URL: http://site:3000/api/revalidate
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:?set in deploy/.env}
      # Where `npm run seed` finds the content and media to import.
      SEED_SOURCE: /srv/site-public
    volumes:
      - uploads:/opt/app/public/uploads
      - ../public:/srv/site-public:ro

  site:
    build:
      context: ..
      args:
        STRAPI_URL: http://cms:1337
        STRAPI_PUBLIC_URL: https://${CMS_DOMAIN}
    restart: unless-stopped
    depends_on:
      cms:
        condition: service_healthy
    environment:
      STRAPI_URL: http://cms:1337
      STRAPI_PUBLIC_URL: https://${CMS_DOMAIN}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}

  caddy:
    image: public.ecr.aws/docker/library/caddy:2-alpine
    restart: unless-stopped
    depends_on: [site, cms]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?set in deploy/.env}
      CMS_DOMAIN: ${CMS_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data:
  uploads:
  caddy-data:
  caddy-config:
